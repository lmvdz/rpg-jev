name: check
on:
  pull_request:
  push:
    branches: [main, poc]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Offline by construction: tests answer from demo/recordings.json, keyed by request id.
      - run: pnpm check
