<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rpg-jev</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d0e14;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated;
      }
      #hud {
        position: fixed;
        left: 8px;
        top: 8px;
        margin: 0;
        padding: 6px 8px;
        font: 12px/1.4 ui-monospace, Consolas, monospace;
        color: #e8e4d4;
        background: rgba(13, 14, 20, 0.7);
        white-space: pre;
        pointer-events: none;
      }
      .editor {
        position: fixed;
        right: 8px;
        top: 8px;
        width: 336px;
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        padding: 8px;
        font: 12px/1.4 ui-monospace, Consolas, monospace;
        color: #e8e4d4;
        background: rgba(13, 14, 20, 0.88);
        user-select: none;
      }
      .editor h2 {
        margin: 8px 0 4px;
        font-size: 11px;
        font-weight: normal;
        color: #9aa0a8;
      }
      .editor .row {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
        align-items: center;
      }
      .editor button {
        font: inherit;
        color: #e8e4d4;
        background: #2a2d3c;
        border: 1px solid #5a5f6e;
        padding: 2px 6px;
        cursor: pointer;
      }
      .editor button.swatch {
        min-width: 18px;
        min-height: 18px;
        color: #0d0e14;
        text-shadow: 0 0 2px #e8e4d4;
      }
      .editor button.lit {
        outline: 2px solid #e8a23a;
        outline-offset: -1px;
      }
      .editor .label,
      .editor .value {
        min-width: 36px;
      }
      .editor .value {
        text-align: center;
      }
      .editor .glyphs {
        width: 256px;
        image-rendering: pixelated;
        cursor: pointer;
      }
      .editor .status {
        margin-top: 8px;
        white-space: pre-wrap;
        color: #9aa0a8;
        min-height: 3.2em;
      }
      .status-bars {
        position: fixed;
        left: 8px;
        bottom: 8px;
        padding: 6px 8px;
        font: 12px/1.5 ui-monospace, Consolas, monospace;
        color: #e8e4d4;
        background: rgba(13, 14, 20, 0.7);
        pointer-events: none;
      }
      .status-row {
        display: grid;
        grid-template-columns: 58px 120px 30px;
        align-items: center;
        gap: 6px;
      }
      .status-bar {
        height: 7px;
        background: #2a2d3c;
        outline: 1px solid #0d0e14;
      }
      .status-bar > div {
        height: 100%;
      }
      .status-bar.low {
        animation: status-low 0.9s steps(2) infinite;
      }
      @keyframes status-low {
        50% {
          outline-color: #b13e31;
        }
      }
      .status-value {
        text-align: right;
        color: #9aa0a8;
      }
      .status-row > .status-value:nth-child(2) {
        grid-column: 2 / 4;
        text-align: left;
        color: #e8a23a;
      }
      .tooltip,
      .menu {
        position: fixed;
        z-index: 5;
        font: 12px/1.4 ui-monospace, Consolas, monospace;
        color: #e8e4d4;
        background: rgba(13, 14, 20, 0.92);
        border: 1px solid #5a5f6e;
      }
      .tooltip {
        padding: 4px 7px;
        white-space: pre;
        pointer-events: none;
      }
      .menu button {
        display: block;
        width: 100%;
        padding: 4px 10px;
        font: inherit;
        color: inherit;
        text-align: left;
        background: none;
        border: 0;
        cursor: pointer;
      }
      .menu input {
        width: 260px;
        padding: 5px 8px;
        font: inherit;
        color: #e8e4d4;
        background: #0d0e14;
        border: 0;
        outline: 1px solid #e8a23a;
      }
      .menu button:hover {
        background: #2a2d3c;
        color: #e8a23a;
      }
      .food-panel {
        position: fixed;
        right: 8px;
        top: 8px;
        width: min(320px, 38vw);
        max-height: calc(100vh - 32px);
        overflow: auto;
        padding: 10px;
        color: #e8e4d4;
        background: rgba(13, 14, 20, 0.9);
        font: 12px/1.45 ui-monospace, Consolas, monospace;
      }
      .food-panel h2 { font-size: 14px; }
      .food-panel button {
        margin: 3px;
        padding: 6px;
        color: inherit;
        background: #2a2d3c;
        border: 1px solid #5a5f6e;
        cursor: pointer;
      }
      .food-panel pre { white-space: pre-wrap; }
      .food-failure { color: #ffba86; border: 1px solid; padding: 6px; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <pre id="hud"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
